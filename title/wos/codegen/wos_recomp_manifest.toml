# WebOfShadowsRecomp for the PS5 - the recompiler's manifest.
#
# wos/tools/codegen.sh copies this into the WebOfShadowsRecomp checkout (whose
# own repository does not publish one) and runs `rexglue codegen` on it there.
# Paths are relative to that checkout: the game's files in game/, as the PC
# release lays them out, the code into generated/default.
#
# The project's name, wos_recomp, is the one WebOfShadowsRecomp's sources expect
# (generated/default/wos_recomp_init.h, PPCImageConfig).
#
# SPDX-License-Identifier: MIT

[project]
name = "wos_recomp"
game_root = "game"

[entrypoint]
file_path = "game/default.xex"
out_directory_path = "generated/default"
includes = []

# Entry points the analysis does not find by itself: code reached only by a tail
# branch (`b`) from another function, reported as "target not in any function".
# Declared here so the branches into them are calls, not REX_FATAL.
[entrypoint.functions]
0x82A05A28 = {}   # b from 0x82A03BEC
0x82A564B0 = {}   # b from 0x82A4B99C
# One function from 0x82A5AA20 to 0x82A5AA74 (a list lookup); the analysis started
# it at 0x82A5AA50, its middle, and left the branches back to 0x82A5AA48 unresolved
0x82A5AA20 = { end = 0x82A5AA74 }
# C++ catch funclets that end in _CxxThrowException (0x82B2B710, a rethrow that
# does not return): the analysis ran on past it into the next funclet and its
# branches into a label of another function did not compile
0x8299A844 = { end = 0x8299A8C0 }
0x829A7570 = { end = 0x829A75EC }
0x829AD178 = { end = 0x829AD1F4 }
0x829B3C80 = { end = 0x829B3CFC }
0x829B79AC = { end = 0x829B7A28 }

# Code the analysis does not reach, found running the game on the console:
# WebOfShadowsRecomp's fallback interpreter ran it instead, which is slower
# and logs it ("[WoS-Interp] Discovered unregistered guest function").
0x829FE470 = { end = 0x829FE488 }
0x82A4B708 = { end = 0x82A4B70C }
0x82A8D8E8 = {}

# Pointer-to-member call thunks (lwz r12,0(rN); lwz r11,off(r12); mtctr r11; bctr),
